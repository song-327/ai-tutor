- id: L2-01
  name: LLM API 调用与参数
  level: 2
  prereq: []
  interview_qs:
    - temperature 调到 1.2 会怎样，什么场景该调高、什么场景必须调低？
    - max_tokens 设得比回答需要的小，模型会怎么表现？
    - 流式输出（stream=True）在前端怎么处理，和一次性返回有什么取舍？
    - 你遇到过 API 超时或限流吗，怎么处理的？
    - 要让同一个问题每次答案一致，你怎么做？
    - 一次调用 500 token 大概多少钱，你怎么估算成本？
  stuck_hint: temperature 不是"随机性开关"，它改的是概率分布的形状；要可复现就用 0
- id: L2-02
  name: 提示词结构与上下文组织
  level: 2
  prereq: []
  interview_qs:
    - 你的 system prompt 里放了什么，为什么这些必须放 system 而不是 user？
    - 少样本示例放几条合适，放多了有什么副作用？
    - 用户输入很长时，你怎么决定保留哪些、丢掉哪些？
    - 怎么让模型稳定输出固定格式，失败率怎么降？
    - 提示词改了一版效果变好，你怎么确认不是运气？
    - 同一段提示词换个模型就失效，你会怎么迁移？
  stuck_hint: 示例不是越多越好，超过 3-5 条往往只增加 token 不提升准确率；格式约束要用 schema 校验兜底，不能只写"请输出 JSON"